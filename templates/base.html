<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Resultra
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>


<body>

    <!-- ========================= -->
    <!-- Navigation Bar -->
    <!-- ========================= -->

    <nav class="navbar">

        <div class="nav-container">

            <a
                href="{{ url_for('home') }}"
                class="nav-brand"
            >
                Resultra
            </a>


            <div class="nav-links">

                <a href="{{ url_for('home') }}">
                    Home
                </a>

                <a href="{{ url_for('profiles') }}">
                    Profiles
                </a>

            </div>

        </div>

    </nav>


    <!-- ========================= -->
    <!-- Main Content -->
    <!-- ========================= -->

    <main class="main-content">

        {% block content %}

        {% endblock %}

    </main>


    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <footer class="site-footer">

        <p>
            Resultra — Smart Results. Simple Generation.
        </p>

    </footer>


    <script
        src="{{ url_for(
            'static',
            filename='js/script.js'
        ) }}"
    ></script>

</body>

</html>
