<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profiles - Resultra</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <h1>Result Profiles</h1>

    <p>
        Create and manage reusable result profiles.
    </p>


    {% if error %}

        <p>
            {{ error }}
        </p>

    {% endif %}


    <a href="{{ url_for('new_profile') }}">
        Create New Profile
    </a>

    <br>
    <br>


    {% if profiles %}

        <h2>Saved Profiles</h2>

        {% for profile in profiles %}

            <div>

                <strong>
                    {{ profile }}
                </strong>

                &nbsp;

                <a
                    href="{{ url_for('view_profile', profile_name=profile) }}"
                >
                    View / Use Profile
                </a>

            </div>

            <br>

        {% endfor %}

    {% else %}

        <p>
            No profiles created yet.
        </p>

    {% endif %}


    <br>

    <a href="{{ url_for('home') }}">
        Back to Home
    </a>

</body>

</html>
